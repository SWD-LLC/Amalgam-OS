# Base44 development environment for the Amalgam Streaming Platform.
#
# The app is a pure frontend: Vite + React + TypeScript, with data persisted in the
# browser's localStorage (src/data/base44.ts). There is no API service, no database and
# no external credential, so this file only runs the Vite dev server from the cloned
# source with live reload.
#
# Usage: docker compose -f docker-compose.base44.yml up -d --build

services:
  web:
    image: node:22-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        # The repository ships no lockfile, so install without generating one and keep
        # the checked-out tree clean.
        CI=true npm install --no-audit --no-fund --no-package-lock
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Bare passthrough of the platform-provided preview flag, plus the host values
      # vite.config.ts needs to allow the preview proxy's host name (see that file).
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure

volumes:
  node_modules:
